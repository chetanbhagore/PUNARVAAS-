services:
  - type: web
    name: punarvaas-backend
    env: python
    plan: free
    region: singapore
    buildCommand: "pip install -r backend/requirements.txt && cd backend && python seed.py"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/stats
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
